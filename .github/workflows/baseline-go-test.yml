name: baseline-go-test

on:
  push:
    branches:
      - 'ci/baseline-full-suite'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup web
        run: bash build.sh dev web

      - name: Run full Go test suite
        run: go test ./...
